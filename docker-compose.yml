# The compose stack (docs/stack.md): Postgres for the event log, leases and the
# graph CTEs; Garage for objects and blobs; Qdrant for the vector index (C5
# descriptors, C8 task-class regions); and the two services.
#
# **Postgres, Garage and Qdrant are here for the store's own `--ignored` tests, not
# for S1.** `agent-s1`'s start-up does not construct them yet (docs/roadmap.md,
# "State"), so `deploy/compose/s1.toml` selects disk plus the in-process queue and
# index, and S1 refuses to start on anything else. The three services are up so the
# C4 integration tests below have something to run against; when S1 binds them,
# that config file changes and this note goes away.
#
# S1 and S2 are **one image, two entrypoints** (see Dockerfile): they share the
# workspace, and the only difference at run time is which binary starts and what
# config it reads. S2 reaches S1 on exactly one endpoint (`POST /telemetry`) and
# pulls everything else from a registry directory — there is no compose link in the
# other direction, because there is no inbound control path into a deployment.
#
# Host ports are offset by 50000 (Postgres 55432, Garage 59000, Qdrant 56333) so the
# stack coexists with whatever else is running on a development machine.
#
#   docker compose up -d
#   sh garage-init.sh          # layout, bucket and the dev access key
#   cargo test -p agent-store --features postgres,s3 -- --ignored --test-threads=1
#
# The store applies its own schema (`PostgresBackend::migrate`, which embeds
# store-schema.sql), so nothing here has to be seeded by hand.

name: agent-system

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 2s
      timeout: 3s
      retries: 30

  garage:
    image: dxflrs/garage:v1.0.1
    # Garage needs its layout, bucket and access key set up once; the init script
    # does all three and is idempotent.
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "59000:3900"
      - "59003:3903"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The VectorIndex backend (C5 descriptors, C8 task-class regions).
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "56333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  # S1: the API, the shard writer and the management UI. It runs the config in
  # `deploy/compose/s1.toml` — disk plus the in-process queue and index, which is
  # what this build's binary can bind. Note that S1 keeps **no durable state at
  # all** today: it writes no event log and runs no jobs, so a restart of this
  # service starts empty (docs/roadmap.md, "State").
  s1:
    build:
      context: .
    command: ["agent-s1", "--config", "/srv/config/s1.toml"]
    environment:
      # Only tightening overrides belong here; the file is the source of truth.
      AGENT_S1_NODE: s1-compose
      AGENT_S1_BIND: 0.0.0.0:8080
      AGENT_S1_WEB_ROOT: /srv/web
      # libpq reads these; the DSN in the config file carries no credentials,
      # because a config file that holds a password is a config file nobody can
      # commit.
      PGUSER: agent
      PGPASSWORD: agent
    ports:
      - "58080:8080"
    volumes:
      - ./deploy/compose:/srv/config:ro
      # The built SPA, if it has been built. `web/dist` is gitignored and absent on
      # a fresh clone, in which case Docker creates an empty directory here and S1
      # serves the page that says how to build it rather than a blank 404. Run
      # `cd web && npm install && npm run build` first to get the real UI.
      - ./web/dist:/srv/web:ro
      - registry:/srv/registry
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "agent-s1 --help >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S2: headless, pull-only. It shares the registry directory read-only — a bundle
  # or a policy arrives as a file it fetches, never as a push.
  s2:
    build:
      context: .
    command: ["agent-s2", "/srv/config/s2.toml"]
    environment:
      AGENT_S2_INSTANCE: s2-compose
      AGENT_S2_LISTEN: 0.0.0.0:8081
      # The registry it polls: bundles, the signed policy and the revocation feed
      # arrive as files S1 writes there and S2 fetches.
      AGENT_S2_REGISTRY: /srv/registry
    ports:
      - "58081:8081"
    volumes:
      - ./deploy/compose:/srv/config:ro
      - registry:/srv/registry:ro
    depends_on:
      s1:
        condition: service_started

volumes:
  registry:
  postgres-data:
  garage-meta:
  garage-data:
  qdrant-data:
