[workspace]
resolver = "3"
members = [
    "crates/contracts",
    "crates/core",
    "crates/library",
    "crates/runtime",
    "crates/store",
    "crates/metrics",
    "crates/swarm",
    "crates/optimizer",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
agent-contracts = { path = "crates/contracts" }
agent-core = { path = "crates/core" }
agent-library = { path = "crates/library" }
agent-metrics = { path = "crates/metrics" }
agent-optimizer = { path = "crates/optimizer" }
agent-swarm = { path = "crates/swarm" }
agent-runtime = { path = "crates/runtime" }
agent-store = { path = "crates/store" }

# Durable store backends (C4): Postgres for the log, leases and graph CTEs; the S3
# client is in-house over hyper (deps.md), with rustls for TLS.
tokio-postgres = "0.7"
postgres-types = "0.2"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio", "http1"] }
http-body-util = "0.1"
bytes = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# The store (C4) and the services are async; tokio is the runtime everywhere.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: canonical hashing requires wire round-trips to preserve doubles
# exactly; serde_json's default fast-path float parse is lossy.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
# NFC verification for the canonical encoder (hash.md requires NFC strings).
unicode-normalization = "0.1"
# TLS for the OpenAI-compatible provider client. The HTTP/1.1 framing itself is
# in-house (deps.md); rustls supplies only the transport.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rand_chacha = "0.9"
thiserror = "2"
proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
