[package]
name = "agent-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "C4: content-addressed objects, genealogy, the append-only event log, blobs and zones, over a six-method backend SPI."

[features]
default = []
# The durable profiles. Off by default so the dev profile and the test suite build
# and run with no external services (docs/stack.md).
postgres = ["dep:tokio-postgres", "dep:postgres-types"]
s3 = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes", "dep:tokio-rustls", "dep:rustls"]

[dependencies]
agent-contracts.workspace = true
agent-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util"] }

tokio-postgres = { workspace = true, optional = true }
postgres-types = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile.workspace = true
proptest.workspace = true
