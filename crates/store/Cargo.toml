[package]
name = "agent-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "C4: content-addressed objects, genealogy, the append-only event log, blobs and zones, over a six-method backend SPI."

[dependencies]
agent-contracts.workspace = true
agent-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util"] }

rustls = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile.workspace = true
proptest.workspace = true
