agent-runtime.workspace = true
agent-store.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true

# The HTTP surface and the static assets, framed by `hyper` like S2's front.
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time"] }

[dev-dependencies]
agent-testkit.workspace = true
proptest.workspace = true
