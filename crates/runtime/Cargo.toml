[package]
name = "agent-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "C2: executes Instances under Limits; causal-frontier scheduling, isolation driver, broker, trace emission, replay."

[dependencies]
agent-contracts.workspace = true
agent-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rustls.workspace = true

# The sandbox guest: hosts one Instance inside its own process and asks the host
# for every metered call, so no credential ever enters it.
[[bin]]
name = "agent-sandbox-host"
path = "src/bin/agent-sandbox-host.rs"


[dev-dependencies]
# The library is a dev-dependency only: C2 depends on contracts and core at run
# time (C2-runtime.md), and uses C1 in tests to build real Units to execute.
agent-library.workspace = true
proptest.workspace = true
