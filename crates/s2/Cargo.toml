[package]
name = "agent-s2"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "C11: the headless deployment service — bundle pull and verification, select-only routing, live evaluation that keeps nothing, the capacity controller, and one-way telemetry."

[dependencies]
agent-contracts.workspace = true
agent-core.workspace = true
agent-library.workspace = true
agent-metrics.workspace = true
agent-obs.workspace = true
agent-promotion.workspace = true
agent-router.workspace = true
agent-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true

# The HTTP front: `hyper` for framing, as everywhere else in this workspace.
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time"] }

[[bin]]
name = "agent-s2"
path = "src/bin/s2.rs"

[dev-dependencies]
agent-testkit.workspace = true
proptest.workspace = true
